name: pub.dev release
on:
  workflow_dispatch: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require secret
        run: |
          if [ -z "$PUB_TOKEN" ]; then
            echo "::error::PUB_TOKEN secret not configured (org Settings - Secrets - Actions)"
            exit 1
          fi
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test
      - run: dart pub token add https://pub.dev --env-var PUB_TOKEN
      - run: dart pub publish --force
